<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بحث عن حالة - Al-Shazly Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="nameplate">
    <div class="title-row">
      <span class="tooth-mark">🦷</span>
      <h1>Al-Shazly Clinic</h1>
    </div>
  </div>

  <div class="page-header">
    <a class="back-link" href="index.html">→ الرئيسية</a>
    <div class="page-title">بحث عن حالة</div>
    <span></span>
  </div>

  <div class="panel">
    <div class="search-row">
      <input id="f-search" type="text" placeholder="ابحث بالاسم أو رقم الهاتف...">
    </div>

    <div class="form-grid" style="margin-bottom:14px;">
      <div>
        <label>فلتر بالتاريخ - من</label>
        <input id="f-date-from" type="date">
      </div>
      <div>
        <label>فلتر بالتاريخ - لحد</label>
        <input id="f-date-to" type="date">
      </div>
      <div class="full" style="display:flex; justify-content:flex-end;">
        <button class="btn btn-ghost btn-sm" id="btn-clear-date-filter">مسح فلتر التاريخ</button>
      </div>
    </div>

    <div id="case-count" style="color:var(--ink-soft); font-size:0.82rem; margin-bottom:10px;"></div>
    <div class="case-list" id="case-list">
      <div class="empty-state">جاري التحميل...</div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="script.js"></script>
</body>
</html>
