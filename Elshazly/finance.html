<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإيرادات والمصروفات - Al-Shazly Clinic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <div class="nameplate">
    <div class="title-row">
      <span class="tooth-mark">🦷</span>
      <h1>Al-Shazly Clinic</h1>
    </div>
  </div>

  <div class="page-header">
    <a class="back-link" href="index.html">→ الرئيسية</a>
    <div class="page-title">الإيرادات والمصروفات</div>
    <span></span>
  </div>

  <div class="panel">
    <div class="month-picker">
      <label style="margin:0;">الشهر</label>
      <input id="rev-month" type="month">
    </div>

    <div class="stat-row">
      <div class="stat-box">
        <div class="label">إجمالي الإيرادات</div>
        <div class="value" id="stat-revenue">٠ جنيه</div>
      </div>
      <div class="stat-box danger">
        <div class="label">إجمالي المصروفات</div>
        <div class="value" id="stat-expenses">٠ جنيه</div>
      </div>
      <div class="stat-box accent">
        <div class="label">صافي الربح</div>
        <div class="value" id="stat-net">٠ جنيه</div>
      </div>
    </div>

    <h2 class="section-title">إضافة إيراد يدوي</h2>
    <div class="rev-add">
      <div>
        <label>المبلغ (جنيه)</label>
        <input id="rev-amount" type="number" min="0" placeholder="0">
      </div>
      <div style="flex:2;">
        <label>وصف (اختياري)</label>
        <input id="rev-note" type="text" placeholder="مثال: دفعة نقدية إضافية">
      </div>
      <div style="flex:none;">
        <button class="btn btn-primary" id="btn-add-revenue">إضافة</button>
      </div>
    </div>

    <h2 class="section-title">تفاصيل إيرادات الشهر</h2>
    <div id="rev-table-wrap"></div>

    <h2 class="section-title" style="margin-top:26px;">إضافة مصروف</h2>
    <div class="rev-add">
      <div>
        <label>المبلغ (جنيه)</label>
        <input id="exp-amount" type="number" min="0" placeholder="0">
      </div>
      <div style="flex:2;">
        <label>وصف</label>
        <input id="exp-note" type="text" placeholder="مثال: فاتورة كهرباء، مستلزمات طبية">
      </div>
      <div style="flex:none;">
        <button class="btn btn-primary" id="btn-add-expense">إضافة</button>
      </div>
    </div>

    <h2 class="section-title">تفاصيل مصروفات الشهر</h2>
    <div id="exp-table-wrap"></div>
  </div>

</div>

<div class="toast" id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-init.js"></script>
<script src="script.js"></script>
</body>
</html>
